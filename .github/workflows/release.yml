name: Release

# Publishes the three images and the Helm chart on a version tag. A tag is the
# only trigger: releases are cut from main, and a dispatch could otherwise push
# a chart whose CRDs do not match the images it points at.
on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  REGISTRY: ghcr.io
  CHART_REPOSITORY: oci://ghcr.io/wutz/charts

jobs:
  images:
    permissions:
      contents: read
      packages: write
    name: Image ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: devpilot
            dockerfile: Dockerfile
          - name: devpilot-init
            dockerfile: Dockerfile.init
          - name: devpilot-commit
            dockerfile: Dockerfile.commit
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The Dockerfiles cross-compile with TARGETOS/TARGETARCH and CGO is off,
      # so both platforms build on the amd64 runner without QEMU.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to the container registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.REGISTRY }}/wutz/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.17.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  chart:
    needs: images
    permissions:
      contents: read
      packages: write
    name: Chart
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      # The chart defaults every image repository to the registry above and
      # every tag to appVersion, so a release only has to set the versions.
      - name: Package the chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/devpilot \
            --version "${version}" \
            --app-version "${version}" \
            --destination dist

      - name: Log in to the chart registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login "${{ env.REGISTRY }}" \
              --username "${{ github.actor }}" --password-stdin

      - name: Push the chart
        run: helm push "dist/devpilot-${GITHUB_REF_NAME#v}.tgz" "${CHART_REPOSITORY}"
