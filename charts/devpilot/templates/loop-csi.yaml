{{- if .Values.loopCSI.enabled }}
{{- $ns := .Values.namespaceOverride | default .Release.Namespace }}
{{- $name := printf "%s-loop-csi" (include "devpilot.fullname" .) }}
{{- $driver := "loop.devpilot.wutz.dev" }}
{{- $kubelet := .Values.loopCSI.kubeletDir }}
{{- $image := printf "%s:%s" .Values.loopCSI.image.repository (default .Chart.AppVersion .Values.loopCSI.image.tag) }}
{{- if not .Values.loopCSI.pools }}
{{- fail "loopCSI.pools must list at least one pool (name and path) when loopCSI.enabled is true" }}
{{- end }}
# The loop CSI driver serves DevBox root disks as ext4 images (disk.img) on a
# shared filesystem. See docs/shared-storage-disk-img.md.
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: {{ $driver }}
  labels:
    {{- include "devpilot.labels" . | nindent 4 }}
spec:
  # Single-writer is enforced by the node plugin (OFD lock, lease, ext4 MMP),
  # so no attach step is needed and an offline commit can read a stopped
  # disk from any node.
  attachRequired: false
  podInfoOnMount: false
  # Never let kubelet chown a root disk recursively for fsGroup.
  fsGroupPolicy: None
  volumeLifecycleModes:
    - Persistent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-controller
  namespace: {{ $ns }}
  labels:
    {{- include "devpilot.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-node
  namespace: {{ $ns }}
  labels:
    {{- include "devpilot.labels" . | nindent 4 }}
---
# Permissions of csi-provisioner, csi-resizer and csi-snapshotter.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-controller
  labels:
    {{- include "devpilot.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "volumeattachments", "volumeattributesclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots", "volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-controller
  labels:
    {{- include "devpilot.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-controller
    namespace: {{ $ns }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-controller
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/component: loop-csi-controller
    {{- include "devpilot.labels" . | nindent 4 }}
spec:
  # One replica: CreateVolume/DeleteVolume/CreateSnapshot serialise per volume
  # inside the process. The sidecars elect a leader anyway, so a surge during
  # a rollout is harmless.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: loop-csi-controller
      {{- include "devpilot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: loop-csi-controller
        {{- include "devpilot.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}-controller
      {{- with .Values.loopCSI.controller.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: driver
          image: {{ $image }}
          imagePullPolicy: {{ .Values.loopCSI.image.pullPolicy }}
          args:
            - --mode=controller
            - --endpoint=unix:///csi/csi.sock
            - --lease-ttl={{ .Values.loopCSI.leaseTTL }}
            - --zap-log-level={{ .Values.loopCSI.logLevel }}
            {{- range .Values.loopCSI.pools }}
            - --pool={{ .name }}={{ .path }}
            {{- end }}
          securityContext:
            # Root on the shared filesystem to create pool directories and
            # run mkfs.ext4 on regular files; no device access is needed.
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            {{- range .Values.loopCSI.pools }}
            - name: pool-{{ .name }}
              mountPath: {{ .path }}
              mountPropagation: HostToContainer
            {{- end }}
          resources:
            {{- toYaml .Values.loopCSI.controller.resources | nindent 12 }}
        - name: csi-provisioner
          image: {{ .Values.loopCSI.sidecars.provisioner }}
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace={{ $ns }}
            # Restoring a snapshot copies the image when the filesystem has
            # no reflink.
            - --timeout={{ .Values.loopCSI.operationTimeout }}
            - --v=2
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-resizer
          image: {{ .Values.loopCSI.sidecars.resizer }}
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace={{ $ns }}
            - --v=2
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-snapshotter
          image: {{ .Values.loopCSI.sidecars.snapshotter }}
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election
            - --leader-election-namespace={{ $ns }}
            - --timeout={{ .Values.loopCSI.operationTimeout }}
            - --v=2
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          emptyDir: {}
        {{- range .Values.loopCSI.pools }}
        - name: pool-{{ .name }}
          hostPath:
            path: {{ .path }}
            type: Directory
        {{- end }}
      {{- with .Values.loopCSI.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.loopCSI.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}-node
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/component: loop-csi-node
    {{- include "devpilot.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: loop-csi-node
      {{- include "devpilot.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: loop-csi-node
        {{- include "devpilot.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}-node
      {{- with .Values.loopCSI.node.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: driver
          image: {{ $image }}
          imagePullPolicy: {{ .Values.loopCSI.image.pullPolicy }}
          args:
            - --mode=node
            - --endpoint=unix://{{ $kubelet }}/plugins/{{ $driver }}/csi.sock
            - --state-dir={{ $kubelet }}/plugins/{{ $driver }}
            - --lease-interval={{ .Values.loopCSI.leaseInterval }}
            - --lease-ttl={{ .Values.loopCSI.leaseTTL }}
            - --zap-log-level={{ .Values.loopCSI.logLevel }}
            {{- range .Values.loopCSI.pools }}
            - --pool={{ .name }}={{ .path }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            # Loop devices, mount(2) and FITRIM need the host's devices and
            # CAP_SYS_ADMIN. Only this node agent is privileged; DevBox pods
            # never see a block device.
            privileged: true
          volumeMounts:
            - name: kubelet-dir
              mountPath: {{ $kubelet }}
              mountPropagation: Bidirectional
            - name: dev
              mountPath: /dev
            {{- range .Values.loopCSI.pools }}
            - name: pool-{{ .name }}
              mountPath: {{ .path }}
              mountPropagation: HostToContainer
            {{- end }}
          resources:
            {{- toYaml .Values.loopCSI.node.resources | nindent 12 }}
        - name: node-driver-registrar
          image: {{ .Values.loopCSI.sidecars.nodeDriverRegistrar }}
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ $kubelet }}/plugins/{{ $driver }}/csi.sock
            - --v=2
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
      volumes:
        - name: kubelet-dir
          hostPath:
            path: {{ $kubelet }}
            type: Directory
        - name: plugin-dir
          hostPath:
            path: {{ $kubelet }}/plugins/{{ $driver }}
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ $kubelet }}/plugins_registry
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        {{- range .Values.loopCSI.pools }}
        - name: pool-{{ .name }}
          hostPath:
            path: {{ .path }}
            type: Directory
        {{- end }}
      {{- with .Values.loopCSI.node.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- toYaml .Values.loopCSI.node.tolerations | nindent 8 }}
{{- range .Values.loopCSI.storageClasses }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .name }}
  labels:
    {{- include "devpilot.labels" $ | nindent 4 }}
provisioner: {{ $driver }}
allowVolumeExpansion: true
reclaimPolicy: {{ .reclaimPolicy | default "Delete" }}
volumeBindingMode: Immediate
parameters:
  pool: {{ .pool | quote }}
  {{- $dio := "required" }}
  {{- if hasKey . "directIO" }}
  {{- if eq (kindOf .directIO) "bool" }}
  {{- $dio = ternary "required" "off" .directIO }}
  {{- else if .directIO }}
  {{- $dio = toString .directIO }}
  {{- end }}
  {{- end }}
  directIO: {{ $dio | quote }}
  trimOnUnmount: {{ ternary "true" "false" (ne (toString .trimOnUnmount) "false") | quote }}
  {{- with .trimMinLength }}
  trimMinLength: {{ . | quote }}
  {{- end }}
  {{- if eq (toString .mmp) "false" }}
  mmp: "false"
  {{- end }}
{{- end }}
{{- with .Values.loopCSI.snapshotClass }}
{{- if .create }}
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: {{ .name }}
  labels:
    {{- include "devpilot.labels" $ | nindent 4 }}
driver: {{ $driver }}
deletionPolicy: {{ .deletionPolicy | default "Delete" }}
parameters:
  snapshotStrategy: {{ .strategy | default "auto" | quote }}
  # DevPilot freezes the root disk around CreateSnapshot, so a copy of a
  # mounted image is consistent. Other users of this class must freeze too.
  allowLiveCopy: {{ ternary "true" "false" (ne (toString .allowLiveCopy) "false") | quote }}
{{- end }}
{{- end }}
{{- end }}
