# Default values for the DevPilot controller chart.
replicaCount: 2

image:
  repository: ghcr.io/wutz/devpilot
  # Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# Image injected as the devpilot-init container that performs the overlay
# chroot/pivot_root and PID 1 supervision. It must be a static binary image.
init:
  image:
    repository: ghcr.io/wutz/devpilot-init
    tag: ""
    pullPolicy: IfNotPresent

# Image the DevBoxCommit build Jobs run. It streams the increment layer from
# the root disk into the registry, so it must be reachable from the build
# namespace and be able to write to the registry named in the push secret.
commit:
  image:
    repository: ghcr.io/wutz/devpilot-commit
    tag: ""
    pullPolicy: IfNotPresent

build:
  # Suffix of the per-project namespace that holds the copied registry push
  # credential. Project members can read secrets in their own project, so the
  # durable copy is kept in <project><suffix> and a short-lived per-commit copy
  # is the only thing that appears in the project namespace. Empty keeps the
  # credential in the project namespace, which is only safe when members cannot
  # read secrets there.
  namespaceSuffix: "-build"

retention:
  # What happens to the root disk of a DevBox that sat out its
  # spec.rootDisk.retentionDaysAfterStop window: trash hands the claim to the
  # volumetrash recycler, which holds it for a recovery buffer before deleting
  # the volume; delete removes the claim together with the DevBox.
  reclaim: trash

prewarm:
  # Namespace where ImagePrewarm zero-GPU Pods run. Empty defaults to the
  # operator's DEVPILOT_NAMESPACE (release namespace).
  namespace: ""

prepull:
  # Minimum base image manifest size that triggers automatic two-phase
  # GPU-free pre-pulling before allocating a GPU node. Set to "0" to disable.
  threshold: "20Gi"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# CRDs are shipped in the chart's crds/ directory and are installed once, on
# first install, by Helm itself. Keep this enabled unless the CRDs are managed
# separately (e.g. by a platform add-on).
crds:
  create: true

serviceAccount:
  create: true
  # Defaults to the fullname plus "-controller-manager".
  name: ""
  annotations: {}

rbac:
  # Create the ClusterRole/ClusterRoleBinding granting the controller access to
  # devboxes and their child resources.
  create: true
  # Create devpilot-member-edit and devpilot-member-view, the ClusterRoles the
  # workspace.wutz.dev project operator aggregates into project members by
  # label. Disable when the cluster has no such operator and members are
  # granted access some other way.
  memberRoles: true

leaderElection:
  enabled: true

metrics:
  enabled: true
  service:
    port: 8443
  serviceMonitor:
    enabled: false
    interval: 30s
    additionalLabels: {}

webhook:
  # Admission webhook for spec validation and defaults. When enabled the
  # manager serves it on port with the certificate from secretName, which must
  # hold tls.crt and tls.key (cert-manager issues one for the webhook Service).
  enabled: false
  port: 9443
  secretName: webhook-server-cert

# Namespace where the operator runs. Empty means the release namespace.
namespaceOverride: ""

env: []

# Extra manager arguments appended after the chart-generated ones, for flags
# the chart does not model yet (e.g. --ingress-class=nginx).
extraArgs: []

nodeSelector: {}
tolerations: []
affinity: {}

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

# Defaults applied to generated DevBox pods.
defaults:
  # RuntimeClass used for GPU devboxes.
  runtimeClassName: nvidia
  # Label carrying the GPU model on GPU nodes.
  gpuModelLabel: scclabs.dev/gpu
  # Storage class assumed to support CSI snapshots for online commits.
  snapshotClassByStorageClass:
    block-nvme: csi-rbdplugin-snapclass
    block-vast-cs: vast-snapshot-cs

# Optional CSI driver for root disks on a shared filesystem (IBM Storage
# Scale, VAST NFS, CephFS): every root disk is a sparse ext4 image
# (disk.img) the node plugin mounts through a loop device with direct I/O.
# Use it where no block storage is available. See
# docs/shared-storage-disk-img.md for the stability and performance
# trade-offs and the PoC checklist to run before enabling it.
loopCSI:
  enabled: false
  image:
    repository: ghcr.io/wutz/devpilot-loop-csi
    tag: ""
    pullPolicy: IfNotPresent
  # Shared-filesystem directories volumes are created in. Each must be
  # mounted at the same path on every node that runs DevBoxes and on the node
  # running the controller, before the pods start.
  #   - name: vast
  #     path: /mnt/vast/devpilot-rootdisks
  pools: []
  # One StorageClass per entry; DevBoxes select it in spec.rootDisk.
  #   - name: shared-loop-vast
  #     pool: vast
  #     directIO: required     # required | preferred | off
  #     trimOnUnmount: true    # FITRIM before unmount to punch holes
  #     trimMinLength: "1048576"
  #     mmp: true              # ext4 multi-mount protection
  #     reclaimPolicy: Delete
  storageClasses: []
  snapshotClass:
    create: true
    name: devpilot-loop-snapclass
    # auto (reflink, else copy) | reflink | copy | cephfs-snapdir
    strategy: auto
    # The DevPilot controller freezes the root disk around CreateSnapshot,
    # which makes a copy of a mounted image consistent. The copy then runs
    # while the DevBox is frozen: on filesystems without reflink (Storage
    # Scale, most NFS) raise the manager's --commit-freeze-timeout (via
    # extraArgs) or commit stopped DevBoxes.
    allowLiveCopy: true
    deletionPolicy: Delete
  kubeletDir: /var/lib/kubelet
  leaseInterval: 10s
  leaseTTL: 45s
  # CreateVolume from a snapshot and CreateSnapshot copy the image when the
  # filesystem has no reflink.
  operationTimeout: 600s
  logLevel: info
  sidecars:
    provisioner: registry.k8s.io/sig-storage/csi-provisioner:v5.3.0
    resizer: registry.k8s.io/sig-storage/csi-resizer:v1.14.0
    snapshotter: registry.k8s.io/sig-storage/csi-snapshotter:v8.3.0
    nodeDriverRegistrar: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.14.0
  controller:
    priorityClassName: system-cluster-critical
    nodeSelector: {}
    tolerations: []
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
  node:
    priorityClassName: system-node-critical
    nodeSelector: {}
    tolerations:
      - operator: Exists
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
