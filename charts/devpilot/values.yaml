# Default values for the DevPilot controller chart.
replicaCount: 2

image:
  repository: ghcr.io/wutz/devpilot
  # Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# Image injected as the devpilot-init container that performs the overlay
# chroot/pivot_root and PID 1 supervision. It must be a static binary image.
init:
  image:
    repository: ghcr.io/wutz/devpilot
    tag: ""
    pullPolicy: IfNotPresent

build:
  # Suffix of the per-project namespace that holds the copied registry push
  # credential. Project members can read secrets in their own project, so the
  # durable copy is kept in <project><suffix> and a short-lived per-commit copy
  # is the only thing that appears in the project namespace. Empty keeps the
  # credential in the project namespace, which is only safe when members cannot
  # read secrets there.
  namespaceSuffix: "-build"

retention:
  # What happens to the root disk of a DevBox that sat out its
  # spec.rootDisk.retentionDaysAfterStop window: trash hands the claim to the
  # volumetrash recycler, which holds it for a recovery buffer before deleting
  # the volume; delete removes the claim together with the DevBox.
  reclaim: trash

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# CRDs are shipped in the chart's crds/ directory and are installed once, on
# first install, by Helm itself. Keep this enabled unless the CRDs are managed
# separately (e.g. by a platform add-on).
crds:
  create: true

serviceAccount:
  create: true
  # Defaults to the fullname plus "-controller-manager".
  name: ""
  annotations: {}

rbac:
  # Create the ClusterRole/ClusterRoleBinding granting the controller access to
  # devboxes and their child resources.
  create: true
  # Create devpilot-member-edit and devpilot-member-view, the ClusterRoles the
  # workspace.wutz.dev project operator aggregates into project members by
  # label. Disable when the cluster has no such operator and members are
  # granted access some other way.
  memberRoles: true

leaderElection:
  enabled: true

metrics:
  enabled: true
  service:
    port: 8443
  serviceMonitor:
    enabled: false
    interval: 30s
    additionalLabels: {}

webhook:
  # Admission webhook for spec validation and defaults.
  enabled: false
  port: 9443

# Namespace where the operator runs. Empty means the release namespace.
namespaceOverride: ""

env: []

nodeSelector: {}
tolerations: []
affinity: {}

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

# Defaults applied to generated DevBox pods.
defaults:
  # RuntimeClass used for GPU devboxes.
  runtimeClassName: nvidia
  # Label carrying the GPU model on GPU nodes.
  gpuModelLabel: scclabs.dev/gpu
  # Storage class assumed to support CSI snapshots for online commits.
  snapshotClassByStorageClass:
    block-nvme: csi-rbdplugin-snapclass
    block-vast-cs: vast-snapshot-cs
