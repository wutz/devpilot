---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: devboxes.devpilot.wutz.dev
spec:
  group: devpilot.wutz.dev
  names:
    kind: DevBox
    listKind: DevBoxList
    plural: devboxes
    singular: devbox
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.desiredState
      name: State
      type: string
    - jsonPath: .status.activeImage
      name: Image
      priority: 1
      type: string
    - jsonPath: .status.nodeName
      name: Node
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DevBox is the Schema for the devboxes API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of DevBox
            properties:
              access:
                description: access configures SSH, Jupyter and custom web ports.
                properties:
                  jupyter:
                    description: jupyter configures the JupyterLab server.
                    properties:
                      enabled:
                        description: enabled turns JupyterLab on.
                        type: boolean
                      port:
                        default: 8888
                        description: port is the JupyterLab port, 8888 by default.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      tokenSecretRef:
                        description: |-
                          tokenSecretRef points at an existing token secret; when empty the operator
                          generates and persists one.
                        properties:
                          key:
                            description: The key of the secret to select from.  Must
                              be a valid secret key.
                            type: string
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                          optional:
                            description: Specify whether the Secret or its key must
                              be defined
                            type: boolean
                        required:
                        - key
                        type: object
                        x-kubernetes-map-type: atomic
                    type: object
                  ports:
                    description: ports exposes extra HTTP ports through the gateway/ingress.
                    items:
                      description: DevBoxPort is an extra HTTP port.
                      properties:
                        name:
                          description: |-
                            name identifies the exposed port. It becomes the Service port name and the
                            leftmost label of the public host, so it follows the DNS-1123 label rules.
                          maxLength: 15
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        port:
                          description: port is the container port.
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        protocol:
                          default: HTTP
                          description: protocol is the application protocol; HTTP
                            by default.
                          enum:
                          - HTTP
                          - GRPC
                          type: string
                      required:
                      - name
                      - port
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                    x-kubernetes-validations:
                    - message: port names ssh and jupyter are reserved
                      rule: self.all(p, !(p.name in ['ssh', 'jupyter']))
                    - message: port numbers must be unique
                      rule: self.all(p, self.filter(q, q.port == p.port).size() ==
                        1)
                  ssh:
                    description: ssh configures the in-container SSH server.
                    properties:
                      authorizedKeys:
                        description: authorizedKeys are injected with a managed-by:devpilot
                          marker.
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: set
                      enabled:
                        default: true
                        description: enabled turns the in-container sshd on.
                        type: boolean
                      gatewayRef:
                        description: gatewayRef asks the operator to publish an SSHRoute.
                        properties:
                          name:
                            type: string
                          namespace:
                            type: string
                        type: object
                      passwordSecretRef:
                        description: passwordSecretRef enables password login from
                          an existing secret.
                        properties:
                          key:
                            description: The key of the secret to select from.  Must
                              be a valid secret key.
                            type: string
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                          optional:
                            description: Specify whether the Secret or its key must
                              be defined
                            type: boolean
                        required:
                        - key
                        type: object
                        x-kubernetes-map-type: atomic
                      username:
                        default: root
                        description: username is the login user, root by default.
                        type: string
                    type: object
                type: object
              args:
                description: args overrides the image CMD when command is set.
                items:
                  type: string
                type: array
              billingMode:
                default: OnDemand
                description: billingMode is immutable after creation (ai-prd §6.2).
                enum:
                - OnDemand
                - Spot
                type: string
                x-kubernetes-validations:
                - message: billingMode is immutable after creation
                  rule: self == oldSelf
              command:
                description: |-
                  command overrides the image ENTRYPOINT/CMD. Empty inherits them; when the
                  image has no long running command the container falls back to sleep infinity.
                items:
                  type: string
                type: array
              desiredState:
                default: Running
                description: desiredState is the requested power state.
                enum:
                - Running
                - Stopped
                type: string
              displayName:
                description: displayName is a human readable name shown in consoles.
                maxLength: 128
                type: string
              env:
                description: env is appended to the container environment. DEVPILOT_*
                  names are reserved.
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: |-
                        Name of the environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: |-
                                The key to select from the ConfigMap's Data field.
                                Keys in the BinaryData field are not currently propagated to container env vars.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        fileKeyRef:
                          description: |-
                            FileKeyRef selects a key of the env file.
                            Requires the EnvFiles feature gate to be enabled.
                          properties:
                            key:
                              description: |-
                                The key within the env file. An invalid key will prevent the pod from starting.
                                The keys defined within a source may consist of any printable ASCII characters except '='.
                                During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                              type: string
                            optional:
                              default: false
                              description: |-
                                Specify whether the file or its key must be defined. If the file or key
                                does not exist, then the env var is not published.
                                If optional is set to true and the specified key does not exist,
                                the environment variable will not be set in the Pod's containers.

                                If optional is set to false and the specified key does not exist,
                                an error will be returned during Pod creation.
                              type: boolean
                            path:
                              description: |-
                                The path within the volume from which to select the file.
                                Must be relative and may not contain the '..' path or start with '..'.
                              type: string
                            volumeName:
                              description: The name of the volume mount containing
                                the env file.
                              type: string
                          required:
                          - key
                          - path
                          - volumeName
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                maxItems: 128
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: spec.env must not override reserved DEVPILOT_* variables
                  rule: self.all(e, !e.name.startsWith('DEVPILOT_'))
              image:
                description: |-
                  image is the base image. The resolved immutable digest is pinned on first
                  start into status.activeImageDigest.
                minLength: 1
                type: string
              lifecycle:
                description: lifecycle configures idle shutdown and runtime limits.
                properties:
                  idleShutdownMinutes:
                    description: idleShutdownMinutes shuts the devbox down after this
                      much idle time; 0 disables.
                    format: int32
                    minimum: 0
                    type: integer
                  maxRuntimeHours:
                    description: maxRuntimeHours stops the devbox after this many
                      hours; 0 means unlimited.
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              nodeSelector:
                additionalProperties:
                  type: string
                description: nodeSelector is merged into the pod scheduling requirements.
                type: object
              pricePerHour:
                description: pricePerHour is a fixed-point CNY amount per hour, e.g.
                  "2.80".
                pattern: ^[0-9]+(\.[0-9]{1,6})?$
                type: string
              resources:
                description: resources describes the compute shape of the DevBox.
                properties:
                  cpu:
                    anyOf:
                    - type: integer
                    - type: string
                    default: "4"
                    description: cpu is the CPU request/limit quantity, e.g. "8".
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  gpuModel:
                    description: gpuModel selects GPU nodes by label value (scclabs.dev/gpu
                      by default).
                    type: string
                  gpus:
                    description: gpus is the number of GPUs; 0 means a CPU only devbox.
                    format: int32
                    maximum: 64
                    minimum: 0
                    type: integer
                  memory:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 8Gi
                    description: memory is the memory request/limit quantity, e.g.
                      "32Gi".
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  shmRatio:
                    default: "0.5"
                    description: shmRatio is the fraction of memory given to /dev/shm,
                      e.g. "0.5".
                    pattern: ^(0(\.[0-9]+)?|1(\.0+)?)$
                    type: string
                type: object
              rootDisk:
                description: rootDisk configures the persistent overlay upperdir block
                  volume.
                properties:
                  retentionDaysAfterStop:
                    default: 15
                    description: |-
                      retentionDaysAfterStop releases the devbox after this many days without
                      running. 0 disables automatic release.
                    format: int32
                    minimum: 0
                    type: integer
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    description: size is the volume size; online expansion is supported,
                      shrinking is not.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    description: storageClassName must be an RWO block storage class
                      such as block-nvme.
                    minLength: 1
                    type: string
                  volumeSnapshotClassName:
                    description: |-
                      volumeSnapshotClassName overrides the per-storageclass snapshot class
                      mapping used for online commits.
                    type: string
                required:
                - size
                - storageClassName
                type: object
                x-kubernetes-validations:
                - message: rootDisk.storageClassName is immutable
                  rule: self.storageClassName == oldSelf.storageClassName
                - message: rootDisk.size may only grow
                  rule: quantity(self.size).compareTo(quantity(oldSelf.size)) >= 0
              tolerations:
                description: tolerations are passed through to the pod.
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                        Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
              volumes:
                description: volumes are extra shared data mounts; they are never
                  captured by a commit.
                items:
                  description: DevBoxVolume is an additional mount attached to the
                    devbox.
                  properties:
                    mountPath:
                      description: mountPath is where the volume is mounted inside
                        the devbox root.
                      minLength: 1
                      type: string
                    name:
                      description: name identifies the volume.
                      minLength: 1
                      type: string
                    persistentVolumeClaim:
                      description: persistentVolumeClaim references an existing claim
                        in the same namespace.
                      properties:
                        claimName:
                          description: |-
                            claimName is the name of a PersistentVolumeClaim in the same namespace as the pod using this volume.
                            More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes#persistentvolumeclaims
                          type: string
                        readOnly:
                          description: |-
                            readOnly Will force the ReadOnly setting in VolumeMounts.
                            Default false.
                          type: boolean
                      required:
                      - claimName
                      type: object
                    readOnly:
                      description: readOnly mounts the volume read only.
                      type: boolean
                  required:
                  - mountPath
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              zone:
                description: zone optionally constrains scheduling to a site/zone
                  label value.
                type: string
            required:
            - image
            - rootDisk
            type: object
          status:
            description: status defines the observed state of DevBox
            properties:
              activeImage:
                description: activeImage is the image reference currently in use.
                type: string
              activeImageDigest:
                description: activeImageDigest pins the immutable base digest (repo@sha256:...).
                type: string
              conditions:
                description: conditions represent the current state of the DevBox
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoints:
                description: endpoints are the externally reachable URLs.
                properties:
                  jupyter:
                    description: jupyter is the JupyterLab URL.
                    type: string
                  ports:
                    additionalProperties:
                      type: string
                    description: ports maps a spec port name to its public URL.
                    type: object
                  ssh:
                    description: ssh is the ssh:// gateway URL.
                    type: string
                type: object
              interruptedAt:
                description: interruptedAt records when the devbox last entered Interrupted.
                format: date-time
                type: string
              message:
                description: message explains the current phase.
                type: string
              nodeName:
                description: nodeName is the node hosting the devbox pod.
                type: string
              nonRunningSince:
                description: nonRunningSince is the first instant of the current non-running
                  streak.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the last spec generation the controller
                  reconciled.
                format: int64
                type: integer
              pendingRebaseImage:
                description: pendingRebaseImage is applied and upper/ cleared on the
                  next start.
                type: string
              phase:
                description: phase is the lifecycle phase.
                enum:
                - Pending
                - Starting
                - Running
                - Stopping
                - Stopped
                - Interrupted
                - Failed
                type: string
              podName:
                description: podName is the running devbox pod.
                type: string
              rebaseCount:
                description: rebaseCount counts completed rebases.
                format: int32
                type: integer
              rootDiskPVC:
                description: rootDiskPVC is the generated root disk claim name.
                type: string
              scheduledReleaseTime:
                description: scheduledReleaseTime is nonRunningSince + retentionDaysAfterStop.
                format: date-time
                type: string
              segments:
                description: segments is the billing ledger, newest last.
                items:
                  description: BillingSegment is one running interval, aligned with
                    the trainpilot ledger.
                  properties:
                    billedSeconds:
                      description: billedSeconds is the closed duration in seconds.
                      format: int64
                      type: integer
                    cost:
                      description: cost is the fixed-point amount for this segment.
                      pattern: ^[0-9]+(\.[0-9]{1,6})?$
                      type: string
                    endReason:
                      description: endReason closes the segment.
                      enum:
                      - UserStopped
                      - IdleTimeout
                      - Preempted
                      - NodeFailure
                      - AccountArrears
                      - Released
                      type: string
                    endTime:
                      description: endTime is when the segment closed; empty while
                        running.
                      format: date-time
                      type: string
                    id:
                      description: id is monotonically increasing per DevBox.
                      format: int64
                      minimum: 1
                      type: integer
                    nodeName:
                      description: nodeName is the node the segment ran on.
                      type: string
                    pricePerHour:
                      description: pricePerHour snapshots the price at segment start.
                      pattern: ^[0-9]+(\.[0-9]{1,6})?$
                      type: string
                    startTime:
                      description: startTime is when the segment opened.
                      format: date-time
                      type: string
                  required:
                  - id
                  - startTime
                  type: object
                maxItems: 256
                type: array
              startingStep:
                description: startingStep reports granular progress while phase is
                  Starting.
                enum:
                - ""
                - AllocatingResources
                - MountingStorage
                - PullingImage
                - StartingContainers
                type: string
              stoppedAt:
                description: stoppedAt records when the devbox last entered Stopped.
                format: date-time
                type: string
              totalBilledSeconds:
                description: totalBilledSeconds aggregates closed segments.
                format: int64
                type: integer
              totalCost:
                description: totalCost is the fixed-point aggregate cost.
                pattern: ^[0-9]+(\.[0-9]{1,6})?$
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
