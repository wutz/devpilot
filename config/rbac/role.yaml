---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - pods
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods/exec
  verbs:
  - create
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - devpilot.wutz.dev
  resources:
  - devboxcommits
  - devboxes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - devpilot.wutz.dev
  resources:
  - devboxcommits/finalizers
  - devboxes/finalizers
  verbs:
  - update
- apiGroups:
  - devpilot.wutz.dev
  resources:
  - devboxcommits/status
  - devboxes/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshots
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - sshgateway.wutz.dev
  resources:
  - sshgateways
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sshgateway.wutz.dev
  resources:
  - sshroutes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
