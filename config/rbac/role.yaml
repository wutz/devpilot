---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - devpilot.wutz.dev
  resources:
  - devboxcommits
  - devboxes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - devpilot.wutz.dev
  resources:
  - devboxcommits/finalizers
  - devboxes/finalizers
  verbs:
  - update
- apiGroups:
  - devpilot.wutz.dev
  resources:
  - devboxcommits/status
  - devboxes/status
  verbs:
  - get
  - patch
  - update
