apiVersion: devpilot.wutz.dev/v1alpha1
kind: DevBox
metadata:
  labels:
    app.kubernetes.io/name: devpilot
    app.kubernetes.io/managed-by: kustomize
  name: devbox-sample
spec:
  displayName: "Sample GPU DevBox"
  desiredState: Running
  billingMode: OnDemand
  image: nvcr.io/nvidia/pytorch:25.08-py3
  resources:
    gpus: 1
    gpuModel: rtx-5090
    cpu: "8"
    memory: 32Gi
    shmRatio: "0.5"
  rootDisk:
    size: 100Gi
    storageClassName: block-nvme
    retentionDaysAfterStop: 15
  access:
    ssh:
      enabled: true
      username: root
    jupyter:
      enabled: true
      port: 8888
