apiVersion: devpilot.wutz.dev/v1alpha1
kind: DevBoxCommit
metadata:
  labels:
    app.kubernetes.io/name: devpilot
    app.kubernetes.io/managed-by: kustomize
  name: devboxcommit-sample
spec:
  devBoxName: devbox-sample
  destination:
    repository: registry.example.com/devbox/devbox-sample
    tags:
      - v1
  consistency: Sync
  compression: zstd
  cleanPackageCache: true
  changes:
    comment: "Save installed Python and system packages"
  rebaseDevBox: false
