apiVersion: devpilot.wutz.dev/v1alpha1
kind: ImagePrewarm
metadata:
  labels:
    app.kubernetes.io/name: devpilot
    app.kubernetes.io/managed-by: kustomize
  name: imageprewarm-sample
spec:
  image: nvcr.io/nvidia/pytorch:25.08-py3
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
  maxConcurrency: 5
  pinImage: true
