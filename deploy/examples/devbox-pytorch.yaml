apiVersion: devpilot.wutz.dev/v1alpha1
kind: DevBox
metadata:
  name: kcs-pytorch-dev
  namespace: default
spec:
  displayName: "PyTorch 2.4 CUDA 12.4 开发机"
  desiredState: Running
  billingMode: Spot
  pricePerHour: "2.80"
  image: nvcr.io/nvidia/pytorch:24.10-py3
  env:
    - name: HF_ENDPOINT
      value: https://hf-mirror.com
  resources:
    gpus: 1
    gpuModel: RTX-4090
    cpu: "8"
    memory: 32Gi
    shmRatio: "0.5"
  rootDisk:
    size: 50Gi
    storageClassName: block-nvme
    volumeSnapshotClassName: csi-rbdplugin-snapclass
    retentionDaysAfterStop: 15
  volumes:
    - name: shared-nvme
      persistentVolumeClaim:
        claimName: shared-workspace
      mountPath: /root/shared-nvme
      readOnly: false
  access:
    ssh:
      enabled: true
      username: root
      authorizedKeys:
        - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI...ExampleKey== developer@workstation"
      gatewayRef:
        name: main
        namespace: sshgateway-system
    jupyter:
      enabled: true
      port: 8888
    ports:
      - name: tensorboard
        port: 6006
        protocol: HTTP
  lifecycle:
    idleShutdownMinutes: 0
    maxRuntimeHours: 0
