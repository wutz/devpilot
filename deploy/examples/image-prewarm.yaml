# Pre-warm a popular GPU base image across all NVIDIA GPU nodes using
# zero-GPU pods with rolling concurrency throttling (for Spegel P2P seeding)
# and an ultra-lightweight sleep sentinel (--hold) to pin layers against GC.
apiVersion: devpilot.wutz.dev/v1alpha1
kind: ImagePrewarm
metadata:
  name: official-pytorch-25-08-py3
spec:
  image: nvcr.io/nvidia/pytorch:25.08-py3
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
  maxConcurrency: 5
  pinImage: true
  ttlHoursAfterComplete: 0
