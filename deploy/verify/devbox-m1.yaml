# M1 verification manifest: a single-GPU PyTorch devbox pinned to node
# gn-10-243-145-105 so the second start can be moved to gn-10-243-145-106.
apiVersion: devpilot.wutz.dev/v1alpha1
kind: DevBox
metadata:
  name: m1-verify
  namespace: devpilot-verify
spec:
  displayName: "M1 persistence verification"
  desiredState: Running
  billingMode: OnDemand
  image: nvcr.io/nvidia/pytorch:25.08-py3
  resources:
    gpus: 1
    gpuModel: rtx-5090
    cpu: "8"
    memory: 32Gi
    shmRatio: "0.5"
  rootDisk:
    size: 50Gi
    storageClassName: block-nvme
  nodeSelector:
    kubernetes.io/hostname: gn-10-243-145-105
